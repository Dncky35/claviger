<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claviger Zero Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: '#1e293b', // slate-800
                        primary: '#3b82f6', // blue-500
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for a native app feel */
        body { overflow: hidden; user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col antialiased">

    <div style="--wails-draggable:drag" class="h-10 w-full flex items-center justify-center border-b border-slate-800/50 text-xs font-bold tracking-widest text-slate-500 uppercase">
        Claviger
    </div>

    <div class="flex-1 relative overflow-hidden">

        <div id="screen-enroll" class="absolute inset-0 flex flex-col items-center justify-center p-8 hidden animate-fade-in">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary mb-6 shadow-[0_0_30px_rgba(59,130,246,0.2)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-center">Join Network</h2>
            <p class="text-slate-400 text-sm text-center mb-8">Enter your Server URL and the invite token provided by your admin.</p>
            
            <div class="w-full space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Hub Server URL</label>
                    <input type="text" id="input-url" placeholder="http://192.168.1.50:18080" class="w-full bg-surface border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Invitation Token</label>
                    <input type="text" id="input-token" placeholder="clav-..." class="w-full bg-surface border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all">
                </div>
                <button onclick="doEnroll()" id="btn-enroll" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)] active:scale-95 mt-4">
                    Connect to Hub
                </button>
                <p id="enroll-error" class="text-red-400 text-xs text-center mt-2 hidden"></p>
            </div>
        </div>

        <div id="screen-waiting" class="absolute inset-0 flex flex-col items-center justify-center p-8 hidden animate-fade-in">
            <div class="relative w-20 h-20 flex items-center justify-center mb-8">
                <div class="absolute inset-0 bg-yellow-500/20 rounded-full animate-ping"></div>
                <div class="absolute inset-2 bg-yellow-500/40 rounded-full animate-pulse"></div>
                <div class="relative bg-surface border border-yellow-500/50 w-12 h-12 rounded-full flex items-center justify-center text-yellow-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </div>
            
            <h2 class="text-xl font-bold mb-2 text-center">Waiting for Approval</h2>
            <p class="text-slate-400 text-sm text-center leading-relaxed">Your secure identity has been generated.<br>Please ask your IT administrator to approve your device.</p>
        </div>

        <div id="screen-dashboard" class="absolute inset-0 flex flex-col items-center justify-start p-8 hidden animate-fade-in">
            
            <div class="mt-8 mb-12 flex flex-col items-center">
                <p id="status-text" class="text-slate-400 font-bold uppercase tracking-widest text-sm mb-4 transition-colors">Disconnected</p>
                
                <button onclick="toggleVPN()" id="btn-toggle" class="relative w-32 h-32 rounded-full bg-surface border-4 border-slate-700 flex items-center justify-center shadow-xl transition-all duration-300 hover:scale-105 active:scale-95 group">
                    <svg id="icon-power" class="text-slate-500 transition-colors duration-300 group-hover:text-slate-300" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                    <div id="glow-active" class="absolute inset-0 rounded-full shadow-[0_0_40px_rgba(34,197,94,0)] transition-shadow duration-500"></div>
                </button>
            </div>

            <div class="w-full bg-surface/50 border border-slate-700/50 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-0.5">Assigned IP</p>
                    <p id="dash-ip" class="font-mono text-slate-200 text-sm">10.8.0.x</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-0.5">Network</p>
                    <p class="font-medium text-slate-200 text-sm">Claviger ZTNA</p>
                </div>
            </div>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
