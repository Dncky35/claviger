<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claviger Zero Trust</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0f172a', surface: '#1e293b', primary: '#3b82f6', border: '#334155', success: '#22c55e', destructive: '#ef4444', 'muted-foreground': '#94a3b8',
                    }
                }
            }
        }
    </script>
    <style>
        body { overflow: hidden; user-select: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-background text-white h-screen flex flex-col antialiased">

    <div style="--wails-draggable:drag" class="h-10 w-full flex items-center justify-center border-b border-border/50 text-xs font-bold tracking-widest text-muted-foreground uppercase bg-surface/30 shrink-0 z-50">
        Claviger Network
    </div>

    <div id="fatal-error-log" class="hidden absolute top-12 left-4 right-4 bg-red-900/90 border border-red-500 p-4 rounded-lg z-[100] text-xs font-mono text-white break-words"></div>

    <div id="view-enroll" class="hidden flex-1 flex-col items-center justify-center p-8 relative">
        <div class="max-w-md w-full space-y-8 relative z-10">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-primary/20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(59,130,246,0.3)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-primary"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Join Network</h1>
                <p class="text-muted-foreground text-sm">Follow the 2-step process to secure your connection.</p>
            </div>

            <div class="bg-surface border border-border p-6 rounded-2xl shadow-xl space-y-6">
                
                <div class="space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-primary/20 text-primary text-xs font-bold px-2 py-0.5 rounded">Step 1</span>
                        <h3 class="text-sm font-bold text-slate-200">Send Connection Request</h3>
                    </div>
                    <button id="btn-generate-req" onclick="handleGenerateRequest()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl font-bold transition-all border border-border flex justify-center items-center gap-2 text-sm">
                        Generate Request Token
                    </button>
                    <div id="req-copy-container" class="hidden mt-3">
                        <button id="btn-copy-req" onclick="copyClientRequest()" class="w-full bg-primary/20 hover:bg-primary/30 text-primary py-3 rounded-xl font-bold transition-all border border-primary/30 flex justify-center items-center gap-2 text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy Request to Clipboard
                        </button>
                    </div>
                </div>

                <div class="h-px w-full bg-border/50"></div>

                <div class="space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-success/20 text-success text-xs font-bold px-2 py-0.5 rounded">Step 2</span>
                        <h3 class="text-sm font-bold text-slate-200">Apply Server Approval</h3>
                    </div>
                    <input type="password" id="input-visa" class="w-full bg-background border border-border rounded-xl p-4 text-sm text-slate-200 font-mono focus:border-success focus:ring-1 focus:ring-success outline-none transition-all placeholder:text-slate-600" placeholder="Paste the Visa Token here...">
                    <p id="enroll-error" class="text-destructive text-sm font-medium hidden"></p>
                    <button id="btn-verify" onclick="handleVerify()" class="w-full bg-success hover:bg-success/90 text-white shadow-[0_0_15px_rgba(34,197,94,0.3)] py-3 rounded-xl font-bold transition-all text-sm">
                        Verify
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="view-dashboard" class="hidden flex-1 flex-col items-center justify-center p-8 relative">
        <div class="max-w-sm w-full space-y-8 text-center">
            <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
                <div class="absolute inset-0 bg-success/20 rounded-full animate-ping" style="animation-duration: 3s;"></div>
                <div class="absolute inset-2 bg-success/30 rounded-full animate-pulse"></div>
                <div class="relative z-10 w-20 h-20 bg-success rounded-2xl flex items-center justify-center shadow-[0_0_40px_rgba(34,197,94,0.5)] transform rotate-12">
                    <div class="w-16 h-16 bg-background rounded-xl flex items-center justify-center -rotate-12">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-success"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-white tracking-tight">Secured</h2>
                <p class="text-success font-medium tracking-wide uppercase text-xs">Zero-Trust Tunnel Active</p>
            </div>

            <div class="bg-surface border border-border p-5 rounded-2xl shadow-lg space-y-4 text-left">
                <div class="flex justify-between items-center border-b border-border/50 pb-3">
                    <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Assigned IP</span>
                    <span id="dash-ip" class="font-mono text-primary font-bold text-sm">10.8.0.x</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Target Node</span>
                    <span id="dash-endpoint" class="font-mono text-slate-300 text-sm">Waiting...</span>
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <button id="btn-toggle-vpn" onclick="handleToggleVPN()" class="w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white py-4 rounded-xl font-bold transition-colors text-sm shadow-sm flex items-center justify-center gap-3">
                    <div id="status-indicator" class="w-3 h-3 rounded-full bg-success shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                    <span id="toggle-text">Disconnect Tunnel</span>
                </button>
                <button onclick="handleLeaveNetwork()" class="w-full text-xs font-bold text-muted-foreground hover:text-destructive transition-colors py-2 uppercase tracking-wider">
                    Forget Network & Reset Device
                </button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
