<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claviger Local Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', } } } } }
    </script>
</head>
<body class="bg-gray-900 text-slate-300 min-h-screen font-sans selection:bg-blue-500/30">
    
    {{ template "navbar" . }}

    <main class="max-w-[1600px] w-full mx-auto px-6 py-8 pb-20">
        {{ template "tab_system" . }}
        {{ template "tab_security" . }}
        {{ template "tab_peers" . }}
        </main>

    {{ template "scripts" . }}

</body>
</html>
