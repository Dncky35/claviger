
{{ define "navbar" }}
<nav class="bg-surface border-b border-border px-6 py-4 flex justify-between items-center z-50 shadow-sm shrink-0">
    <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center">
            <img
                src="/static/icon.png"
                alt="Logo"
                class="w-full h-full object-contain"
            />
        </div>

        <h1 class="text-xl font-bold tracking-tight text-foreground">
            {{ T "navbar.title" }}
        </h1>
    </div>

    <div class="flex items-center space-x-4">
        <!-- Reserved for status indicators or badges -->
    </div>

    <div class="flex items-center space-x-4">
        <!-- Support / Donation -->
        <a
            href="https://kreosus.com/cloudrocean"
            target="_blank"
            rel="noopener noreferrer"
            class="bg-primary hover:bg-primary/90 text-white shadow-[0_0_15px_rgba(59,130,246,0.3)] px-5 py-2.5 rounded-xl font-semibold transition-all text-sm flex items-center gap-2 text-xs font-bold uppercase tracking-widest shadow-sm"
        >
            <span aria-hidden="true">❤️</span>
            {{ T "navbar.donate" }}
        </a>

        <!-- Language Selector -->
        <div class="relative inline-block text-left" id="lang-menu-container">
            <button
                id="btn-lang-toggle"
                type="button"
                onclick="toggleLangMenu()"
                class="p-2.5 bg-surface hover:bg-surface-hover border border-border rounded-lg text-muted-foreground hover:text-foreground transition-colors flex items-center justify-center shadow-sm"
                title="Change Language"
                aria-label="Change Language"
                aria-controls="lang-dropdown"
                aria-expanded="false"
            >
                <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                    ></path>
                </svg>
            </button>

            <!-- Dropdown Panel -->
            <div
                id="lang-dropdown"
                class="hidden absolute right-0 mt-2 w-48 origin-top-right rounded-xl bg-surface-elevated border border-border shadow-panel ring-1 ring-border/70 focus:outline-none z-50 overflow-hidden"
            >
                <div class="py-1">
                    <button
                        type="button"
                        onclick="switchLanguage('en')"
                        class="w-full text-left px-4 py-2.5 text-sm font-medium text-muted-foreground hover:bg-surface-hover hover:text-foreground transition-colors flex items-center gap-3"
                    >
                        <span class="text-lg" aria-hidden="true">🇺🇸</span>
                        English
                    </button>

                    <button
                        type="button"
                        onclick="switchLanguage('tr')"
                        class="w-full text-left px-4 py-2.5 text-sm font-medium text-muted-foreground hover:bg-surface-hover hover:text-foreground transition-colors flex items-center justify-between"
                    >
                        <div class="flex items-center gap-3">
                            <span class="text-lg" aria-hidden="true">🇹🇷</span>
                            Türkçe
                        </div>

                        <span class="text-[9px] bg-warning/10 text-warning border border-warning/20 px-1.5 py-0.5 rounded uppercase tracking-wider font-bold">
                            Beta
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
    // Toggle the language dropdown.
    function toggleLangMenu() {
        const dropdown = document.getElementById('lang-dropdown');
        const toggle = document.getElementById('btn-lang-toggle');

        if (!dropdown || !toggle) return;

        const isHidden = dropdown.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', String(!isHidden));
    }

    // Close the dropdown when clicking outside.
    document.addEventListener('click', function (event) {
        const container = document.getElementById('lang-menu-container');
        const dropdown = document.getElementById('lang-dropdown');
        const toggle = document.getElementById('btn-lang-toggle');

        if (
            container &&
            dropdown &&
            !container.contains(event.target)
        ) {
            dropdown.classList.add('hidden');
            toggle?.setAttribute('aria-expanded', 'false');
        }
    });

    // Close the dropdown with Escape.
    document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;

        const dropdown = document.getElementById('lang-dropdown');
        const toggle = document.getElementById('btn-lang-toggle');

        if (dropdown && !dropdown.classList.contains('hidden')) {
            dropdown.classList.add('hidden');
            toggle?.setAttribute('aria-expanded', 'false');
            toggle?.focus();
        }
    });

    // Save the selected language and reload the page.
    function switchLanguage(lang) {
        const supportedLanguages = ['en', 'tr'];

        if (!supportedLanguages.includes(lang)) return;

        const maxAge = 60 * 60 * 24 * 365;

        document.cookie =
            `claviger_lang=${lang}; path=/; max-age=${maxAge}; SameSite=Lax`;

        window.location.reload();
    }
</script>
{{ end }}

    <script>
        async function loadSidebarContainerState() {
            try {
                const res = await fetch('/api/containers');

                if (!res.ok) return;

                const data = await res.json();

                if (!data.docker_installed) {
                    document.getElementById('btn-extensions')?.classList.add('hidden');
                    document.getElementById('btn-uninstall')?.classList.add('hidden');
                }
            } catch (error) {
                console.error(
                    'Error fetching containers for sidebar:',
                    error
                );
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSidebarContainerState();
        });
    </script>

{{ end }}
