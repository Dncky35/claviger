{{ define "sidebar" }}
<aside class="w-64 bg-surface/30 border-r border-border flex flex-col shrink-0 overflow-y-auto">
    <div class="p-4 space-y-8 mt-4">
        
        <div>
            <h3 class="px-3 text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-3">System Core</h3>
            <div class="space-y-1">
                <button onclick="switchTab('system')" id="btn-system" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">System Overview</button>
                <button onclick="switchTab('network')" id="btn-network" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">Network & Gateway</button>
                <button onclick="switchTab('security')" id="btn-security" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">Security & Firewall</button>
                <button onclick="switchTab('voice')" id="btn-voice" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors flex items-center justify-between">
                    <span>Alerts & Watchdog</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 font-bold">Voice</span>
                </button>
                <button onclick="switchTab('access')" id="btn-access" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">Server SSH Keys</button>
            </div>
        </div>

        <div>
            <h3 class="px-3 text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-3">Identity & Access</h3>
            <div class="space-y-1">
                <button onclick="switchTab('clients')" id="btn-clients" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">VPN Peers</button>
                <button onclick="switchTab('roles')" id="btn-roles" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">Roles & Permissions</button>
            </div>
        </div>

        <div>
            <h3 class="px-3 text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-3">Private Cloud</h3>
            <div class="space-y-1">
                <button onclick="switchTab('containers')" id="btn-containers" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">Container Manager</button>
                <button onclick="switchTab('extensions')" id="btn-extensions" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">Install Apps</button>
                <button onclick="switchTab('uninstall')" id="btn-uninstall" class="px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors">App Management</button>
            </div>
        </div>
    </div>
    
    <script>
         async function loadSidebarContainerState(){
            try {
                const res = await fetch('/api/containers');
                const data = await res.json();

                // console.log('Docker Installed:', data.docker_installed);
                
                // If docker is not installed, hide the extension management tabs
                if(!data.docker_installed){
                    document.getElementById('btn-extensions').classList.add('hidden');
                    document.getElementById('btn-uninstall').classList.add('hidden');
                }
            } catch (error) {
                console.error('Error fetching containers for sidebar:', error);
            }
         }

         // FIX: Use DOMContentLoaded so it runs safely without top-level await errors
         document.addEventListener('DOMContentLoaded', loadSidebarContainerState);
    </script>
</aside>
{{ end }}
