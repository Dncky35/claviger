{{ define "tab_security" }}
<div id="tab-security" class="hidden animate-fade-in">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-100 flex items-center tracking-tight">
                Uncomplicated Firewall (UFW)
                <span id="ufw-badge" class="ml-4 px-3 py-1 text-[10px] uppercase tracking-widest font-bold rounded-full bg-background text-slate-400 border border-border">Checking...</span>
            </h2>
            <p class="text-muted-foreground text-sm mt-1">Manage inbound network traffic rules</p>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="toggleUFW()" id="btn-toggle-ufw" class="bg-destructive/10 text-destructive hover:bg-destructive/20 border border-destructive/20 px-4 py-2 rounded-xl font-medium transition-colors text-sm">
                Disable UFW
            </button>
            <button onclick="addRule()" class="bg-primary hover:bg-primary/90 text-primary-foreground px-4 py-2 rounded-xl font-medium transition-colors shadow-sm text-sm">
                + Add Rule
            </button>
        </div>
    </div>

    <div id="security-insights-container" class="mb-6 space-y-4"></div>

    <div class="bg-surface rounded-2xl border border-border overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-background/50 border-b border-border text-muted-foreground text-[10px] uppercase tracking-widest font-bold">
                        <th class="p-5">To (Port)</th>
                        <th class="p-5">Action</th>
                        <th class="p-5">From (IP)</th>
                        <th class="p-5 text-right">Controls</th>
                    </tr>
                </thead>
                <tbody id="security-rules-list" class="divide-y divide-border/50 text-sm text-slate-300">
                    <tr><td class="p-8 text-center text-muted-foreground italic font-medium" colspan="4">Loading firewall rules...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="bg-background/50 p-3 border-t border-border text-center text-xs font-medium text-muted-foreground" id="security-rules-count">
            Waiting for data...
        </div>
    </div>
</div>
{{ end }}
