{{ define "tab_security" }}
<div id="tab-security" class="hidden animate-fade-in">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-white flex items-center">
                Uncomplicated Firewall (UFW)
                <span id="ufw-badge" class="ml-4 px-3 py-1 text-xs rounded-full bg-gray-500/20 text-gray-400 border border-gray-500/30">Checking...</span>
            </h2>
            <p class="text-gray-400 text-sm mt-1">Manage inbound network traffic rules</p>
        </div>
        <div class="flex space-x-3">
            <button onclick="toggleUFW()" id="btn-toggle-ufw" class="bg-red-600/20 text-red-400 hover:bg-red-600/30 border border-red-500/30 px-4 py-2 rounded-lg font-medium transition text-sm">
                Disable UFW
            </button>
            <button onclick="addRule()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium transition text-sm">
                + Add Rule
            </button>
        </div>
    </div>

    <div id="security-insights-container" class="mb-6 space-y-4"></div>

    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-2xl">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-900/50 border-b border-gray-700 text-gray-400 text-xs uppercase tracking-wider">
                    <th class="p-4 font-medium">To (Port)</th>
                    <th class="p-4 font-medium">Action</th>
                    <th class="p-4 font-medium">From (IP)</th>
                    <th class="p-4 font-medium text-right">Controls</th>
                </tr>
            </thead>
            <tbody id="security-rules-list" class="divide-y divide-gray-700 text-sm">
                <tr><td class="p-8 text-center text-gray-500 italic" colspan="4">Loading firewall rules...</td></tr>
            </tbody>
        </table>
        <div class="bg-gray-900/50 p-3 border-t border-gray-700 text-center text-xs text-gray-500" id="security-rules-count">
            Waiting for data...
        </div>
    </div>
</div>
{{ end }}
