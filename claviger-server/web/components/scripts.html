{{ define "scripts" }}
<script>
    // --- Global State Variables ---
    let lastRxBytes = 0;
    let lastTxBytes = 0;
    let lastTimestamp = 0;

    // --- Tab Navigation Logic ---
    function switchTab(tabId) {
        const tabs = ['system', 'security', 'clients', "access", "roles"];
        tabs.forEach(id => {
            const tabEl = document.getElementById('tab-' + id);
            const btnEl = document.getElementById('btn-' + id);
            if (tabEl) {
                tabEl.classList.add('hidden');
                tabEl.classList.remove('block');
            }
            if (btnEl) {
                btnEl.className = 'py-4 text-sm font-semibold tracking-tight border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-colors';
            }
        });
        
        const activeTab = document.getElementById('tab-' + tabId);
        const activeBtn = document.getElementById('btn-' + tabId);
        
        if (activeTab) {
            activeTab.classList.remove('hidden');
            activeTab.classList.add('block');
        }
        if (activeBtn) {
            activeBtn.className = 'py-4 text-sm font-semibold tracking-tight border-b-2 border-primary text-primary transition-colors';
        }
        
        // Fetch fresh data immediately when switching to a tab
        if (tabId === 'security') fetchSecurityData();
        if (tabId === 'clients') fetchPeersData();
        if (tabId === 'access') fetchSSHKeys();
        if (tabId === 'roles') fetchRolesData();
    }

    // ==========================================
    // 1. VPN PEERS & ENROLLMENT LOGIC
    // ==========================================

    async function generateInvite() {
        const role = prompt("Enter the role for this invite (e.g., admin, standard, developer):", "standard");
        if (!role) return;

        try {
            const res = await fetch('/api/invites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role_id: role })
            });
            const data = await res.json();
            
            prompt("✅ Invitation Generated!\nCopy this secure token and send it to the user:", data.token);
            fetchPeersData();
        } catch (err) { alert("Failed to generate invite."); }
    }

    async function approveClient(clientId, clientName) {
        if(!confirm(`Do you want to approve ${clientName} and permanently assign them an IP address on the VPN?`)) return;

        try {
            const res = await fetch('/api/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: clientId })
            });
            const data = await res.json();
            if(res.ok) {
                alert(`✅ Success! ${data.message}`);
                fetchPeersData();
            } else {
                alert(`Error: ${data.message}`);
            }
        } catch (err) { alert("Approval failed."); }
    }

    async function revokeClient(clientId, clientName) {
        if(!confirm(`🚨 DANGER: Are you sure you want to permanently revoke VPN access for ${clientName}? Their connection will drop instantly.`)) return;

        try {
            const res = await fetch('/api/revoke', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: clientId })
            });
            const data = await res.json();
            if(res.ok) {
                alert(`🚫 ${data.message}`);
                fetchPeersData();
            } else {
                alert(`Error: ${data.message}`);
            }
        } catch (err) { alert("Revocation failed."); }
    }

    async function fetchPeersData() {
        // --- 1. Fetch Clients (Independent Block) ---
        try {
            const clientRes = await fetch('/api/clients');
            if (clientRes.ok) {
                const clients = await clientRes.json();
                const pendingTbody = document.getElementById('list-pending-peers');
                const activeTbody = document.getElementById('list-active-peers');
                let pendingCount = 0;

                if(pendingTbody) pendingTbody.innerHTML = '';
                if(activeTbody) activeTbody.innerHTML = '';

                clients.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-background/50 transition-colors';
                    if (c.status === 'pending') {
                        pendingCount++;
                        tr.innerHTML = `
                            <td class="p-4 font-bold text-slate-200">${c.name}</td>
                            <td class="p-4 text-muted-foreground uppercase text-[10px] tracking-widest font-bold">${c.platform || 'Unknown'}</td>
                            <td class="p-4 text-primary font-medium">${c.role_id}</td>
                            <td class="p-4 text-right">
                                <button onclick="approveClient('${c.id}', '${c.name}')" class="bg-success/10 text-success hover:bg-success/20 border border-success/30 px-3 py-1.5 rounded-lg transition-colors text-[10px] font-bold uppercase tracking-wider shadow-sm">Approve Access</button>
                            </td>
                        `;
                        if(pendingTbody) pendingTbody.appendChild(tr);
                    } else if (c.status === 'active') {
                        tr.innerHTML = `
                            <td class="p-4 font-bold text-slate-200 flex items-center"><div class="w-2 h-2 rounded-full bg-success mr-3 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>${c.name}</td>
                            <td class="p-4 font-mono text-muted-foreground">${c.ip_address}</td>
                            <td class="p-4 text-primary font-medium">${c.role_id}</td>
                            <td class="p-4 text-right">
                                <button onclick="revokeClient('${c.id}', '${c.name}')" class="text-destructive hover:text-white text-xs font-medium bg-background px-3 py-1.5 rounded-lg border border-border hover:bg-destructive hover:border-destructive transition-colors">Revoke</button>
                            </td>
                        `;
                        if(activeTbody) activeTbody.appendChild(tr);
                    }
                });

                const badgeWaiting = document.getElementById('badge-waiting');
                if(badgeWaiting) badgeWaiting.innerText = `${pendingCount} Pending`;
                if(pendingCount === 0 && pendingTbody) pendingTbody.innerHTML = '<tr><td class="p-6 text-center text-muted-foreground italic font-medium" colspan="4">No devices waiting for approval.</td></tr>';
                if(activeTbody && activeTbody.innerHTML === '') activeTbody.innerHTML = '<tr><td class="p-6 text-center text-muted-foreground italic font-medium" colspan="4">No active peers found.</td></tr>';
            }
        } catch (err) { console.error("Error fetching clients:", err); }

        // --- 2. Fetch Invites (Independent Block) ---
        try {
            const inviteRes = await fetch('/api/invites');
            if (inviteRes.ok) {
                const invites = await inviteRes.json();
                const invitesTbody = document.getElementById('list-invites');
                if(invitesTbody) invitesTbody.innerHTML = '';
                
                let activeInvites = 0;
                if(invites) {
                    invites.forEach(inv => {
                        if(!inv.is_used) {
                            activeInvites++;
                            const tr = document.createElement('tr');
                            tr.className = 'hover:bg-surface/80 transition-colors';
                            tr.innerHTML = `
                                <td class="p-4 font-mono text-slate-300">${inv.token}</td>
                                <td class="p-4 text-muted-foreground font-medium">${inv.role_id}</td>
                                <td class="p-4 text-muted-foreground/70 text-xs">${new Date(inv.expires_at).toLocaleString()}</td>
                            `;
                            if(invitesTbody) invitesTbody.appendChild(tr);
                        }
                    });
                }
                if(activeInvites === 0 && invitesTbody) invitesTbody.innerHTML = '<tr><td class="p-6 text-center text-muted-foreground italic font-medium" colspan="3">No active unused invites.</td></tr>';
            }
        } catch (err) { console.error("Error fetching invites:", err); }
    }

    // ==========================================
    // 2. SECURITY & FIREWALL LOGIC
    // ==========================================

    async function executeSecurityAction(payload) {
        try {
            const res = await fetch('/api/security/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                fetchSecurityData();
            } else {
                alert("Action failed. Check terminal logs for permissions.");
            }
        } catch (err) { console.error("Action failed:", err); }
    }

    function deleteRule(port, ruleAction) {
        if(confirm(`🚨 WARNING: Are you sure you want to delete the rule for Port ${port}?\n\nIf this is your WireGuard or SSH port, you might drop your connection.`)) {
            executeSecurityAction({ action: "delete", port: port, rule_action: ruleAction });
        }
    }

    function toggleUFW(currentState) {
        if (currentState === 'active') {
            if(confirm(`🚨 DANGER: Are you sure you want to DISABLE the firewall? Your server will be fully exposed.`)) {
                executeSecurityAction({ action: "disable" });
            }
        } else {
            if(confirm(`🛡️ Enabling Firewall: Claviger will automatically inject safety rules for SSH and VPN before applying.`)) {
                executeSecurityAction({ action: "enable" });
            }
        }
    }

    function addRule() {
        const port = prompt("Enter the Port or Service to Allow (e.g., 80, 443, 8080/tcp):");
        if (port) {
            executeSecurityAction({ action: "add", port: port });
        }
    }

    async function fetchSecurityData() {
        try {
            const res = await fetch('/api/security');
            if (res.ok) {
                const data = await res.json();
                
                // 1. Update Badge
                const badge = document.getElementById('ufw-badge');
                const toggleBtn = document.getElementById('btn-toggle-ufw');
                
                if (badge && toggleBtn) {
                    if (data.ufw_status === 'active') {
                        badge.className = 'ml-4 px-3 py-1 text-[10px] uppercase tracking-widest font-bold rounded-full bg-success/10 text-success border border-success/20';
                        badge.innerText = 'Active';
                        toggleBtn.innerText = 'Disable UFW';
                        toggleBtn.className = 'bg-destructive/10 text-destructive hover:bg-destructive hover:text-white border border-destructive/20 px-4 py-2 rounded-xl font-medium transition-colors text-sm';
                        toggleBtn.onclick = () => toggleUFW('active');
                    } else {
                        badge.className = 'ml-4 px-3 py-1 text-[10px] uppercase tracking-widest font-bold rounded-full bg-destructive/10 text-destructive border border-destructive/20';
                        badge.innerText = 'Inactive';
                        toggleBtn.innerText = 'Enable UFW';
                        toggleBtn.className = 'bg-success/10 text-success hover:bg-success hover:text-white border border-success/20 px-4 py-2 rounded-xl font-medium transition-colors text-sm';
                        toggleBtn.onclick = () => toggleUFW('inactive');
                    }
                }

                // 2. Render Insights
                const insightsContainer = document.getElementById('security-insights-container');
                if (insightsContainer) {
                    insightsContainer.innerHTML = ''; 
                    if (data.insights && data.insights.length > 0) {
                        data.insights.forEach(insight => {
                            let styles = ''; let icon = '';
                            if (insight.level === 'critical') {
                                styles = 'bg-destructive/10 border-destructive/20 text-destructive'; icon = '🚨';
                            } else if (insight.level === 'warning') {
                                styles = 'bg-warning/10 border-warning/20 text-warning'; icon = '⚠️';
                            } else {
                                styles = 'bg-primary/10 border-primary/20 text-primary'; icon = '🛡️';
                            }
                            insightsContainer.innerHTML += `
                                <div class="${styles} border rounded-xl p-5 flex items-start shadow-sm mb-3">
                                    <div class="text-xl mr-4">${icon}</div>
                                    <div>
                                        <h4 class="font-bold text-sm uppercase tracking-wide mb-1">${insight.title}</h4>
                                        <p class="text-slate-300 text-sm leading-relaxed">${insight.message}</p>
                                    </div>
                                </div>
                            `;
                        });
                    }
                }

                // 3. Render Table
                const tbody = document.getElementById('security-rules-list');
                const countDiv = document.getElementById('security-rules-count');
                
                if (tbody && countDiv) {
                    if (!data.rules || data.rules.length === 0) {
                        tbody.innerHTML = '<tr><td class="p-8 text-center text-muted-foreground italic font-medium" colspan="4">No active firewall rules found.</td></tr>';
                        countDiv.innerText = "0 rules applied.";
                        return;
                    }

                    tbody.innerHTML = '';
                    data.rules.forEach(rule => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-background/50 transition-colors';
                        let actionColor = rule.action.includes('ALLOW') ? 'text-success' : 'text-destructive';

                        tr.innerHTML = `
                            <td class="p-5 font-mono text-primary">${rule.to}</td>
                            <td class="p-5 font-bold ${actionColor}">${rule.action}</td>
                            <td class="p-5 text-muted-foreground">${rule.from}</td>
                            <td class="p-5 text-right">
                                <button onclick="deleteRule('${rule.to}', '${rule.action}')" class="text-muted-foreground hover:text-white hover:bg-destructive hover:border-destructive transition-colors text-[10px] font-bold uppercase tracking-wider bg-background px-3 py-1.5 rounded-lg border border-border">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    countDiv.innerText = `Showing ${data.rules.length} active rules`;
                }
            }
        } catch (err) { console.error("Error fetching security:", err); }
    }

    // ==========================================
    // 3. SYSTEM & HARDWARE LOGIC
    // ==========================================

    async function fetchSystemData() {
        try {
            // VPN Status
            const statusRes = await fetch('/api/status');
            if (statusRes.ok) {
                const statusData = await statusRes.json();
                
                // Update VPN Badge
                const vpnBadge = document.getElementById('vpn-status-badge');
                if (vpnBadge && statusData.vpn_state === 'active') {
                    vpnBadge.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-success/10 text-success border border-success/20 shadow-[0_0_10px_rgba(34,197,94,0.2)] transition-colors';
                    vpnBadge.innerText = '● VPN Active';
                }

                // Update Cloud Sync Badge
                const cloudBadge = document.getElementById('cloud-sync-badge');
                if (cloudBadge) {
                    if (statusData.cloud_sync_status === 'Healthy') {
                        cloudBadge.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-primary/10 text-primary border border-primary/20 transition-colors';
                        
                        let timeStr = "Healthy";
                        if (statusData.last_cloud_sync) {
                            const secondsAgo = Math.floor((new Date() - new Date(statusData.last_cloud_sync)) / 1000);
                            timeStr = secondsAgo < 60 ? 'Just now' : Math.floor(secondsAgo/60) + 'm ago';
                        }
                        cloudBadge.innerText = '☁️ Cloud: ' + timeStr;
                    } else {
                        cloudBadge.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-destructive/10 text-destructive border border-destructive/20 animate-pulse';
                        cloudBadge.innerText = '⚠️ Cloud: Offline';
                    }
                }
            }

            // Hardware Stats
            const sysRes = await fetch('/api/system');
            if (sysRes.ok) {
                const sys = await sysRes.json();
                
                const safeSet = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
                const safeStyle = (id, prop, val) => { const el = document.getElementById(id); if (el) el.style[prop] = val; };

                safeSet('sys-cpu-val', sys.cpu_percent + '%');
                safeStyle('sys-cpu-bar', 'width', sys.cpu_percent + '%');
                safeSet('sys-cpu-cores', sys.cpu_cores + ' Cores');
                
                safeSet('sys-ram-val', sys.ram_percent + '%');
                safeStyle('sys-ram-bar', 'width', sys.ram_percent + '%');
                safeSet('sys-ram-text', sys.ram_used_gb + ' / ' + sys.ram_total_gb + ' GB');
                
                safeSet('sys-disk-val', sys.disk_percent + '%');
                safeStyle('sys-disk-bar', 'width', sys.disk_percent + '%');
                safeSet('sys-disk-text', sys.disk_used_gb + ' / ' + sys.disk_total_gb + ' GB');
                
                safeSet('sys-os', sys.os_name);
                safeSet('sys-uptime', sys.uptime);

                const currentTimestamp = Date.now();
                const currentRx = parseInt(sys.net_rx_bytes) || 0;
                const currentTx = parseInt(sys.net_tx_bytes) || 0;
                
                if (lastTimestamp > 0) {
                    const timeDiffSeconds = (currentTimestamp - lastTimestamp) / 1000;
                    const rxSpeedMB = ((currentRx - lastRxBytes) / timeDiffSeconds) / (1024 * 1024);
                    const txSpeedMB = ((currentTx - lastTxBytes) / timeDiffSeconds) / (1024 * 1024);
                    
                    safeSet('sys-net-down', Math.max(0, rxSpeedMB).toFixed(2) + ' MB/s');
                    safeSet('sys-net-up', Math.max(0, txSpeedMB).toFixed(2) + ' MB/s');
                }
                
                lastRxBytes = currentRx; 
                lastTxBytes = currentTx; 
                lastTimestamp = currentTimestamp;
            }
        } catch (err) { console.error("Error fetching system info:", err); }
    }

    // ==========================================
    // BOOT & POLLING
    // ==========================================
    fetchSystemData();
    setInterval(fetchSystemData, 3000); // Fast hardware polling (3s)
    setInterval(fetchSecurityData, 10000); // Slower security polling (10s)
    setInterval(fetchPeersData, 5000); // Poll for new enrollments every 5 seconds


    // ==========================================
    // SERVER AUTHENTICATION
    // ==========================================

    async function fetchSSHKeys() {
        try {
            const res = await fetch('/api/access/ssh');
            if (res.ok) {
                const keys = await res.json();
                const tbody = document.getElementById('list-ssh-keys');
                if (!tbody) return;
                
                if (!keys || keys.length === 0) {
                    tbody.innerHTML = '<tr><td class="p-6 text-center text-muted-foreground italic font-medium" colspan="4">No authorized SSH keys found.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                keys.forEach(k => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-background/50 transition-colors">
                            <td class="p-5 font-bold text-slate-200">${k.comment}</td>
                            <td class="p-5 text-primary font-mono text-xs">${k.key_type}</td>
                            <td class="p-5 font-mono text-muted-foreground text-xs truncate max-w-[200px]">${k.preview}</td>
                            <td class="p-5 text-right">
                                <button onclick="revokeSSHKey('${k.comment}')" class="text-destructive hover:text-white text-xs font-medium bg-background px-3 py-1.5 rounded-lg border border-border hover:bg-destructive hover:border-destructive transition-colors">Revoke</button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (err) { console.error("Error fetching SSH keys:", err); }
    }

    async function addSSHKey() {
        const rawKey = prompt("Paste the full public SSH key (e.g., ssh-ed25519 AAAAC3... user@machine):");
        if (!rawKey) return;

        try {
            const res = await fetch('/api/access/ssh?action=add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ raw_key: rawKey })
            });
            const data = await res.json();
            alert(data.message);
            fetchSSHKeys();
        } catch (err) { alert("Failed to add key."); }
    }

    async function revokeSSHKey(comment) {
        if (!confirm(`🚨 Are you sure you want to revoke SSH access for '${comment}'?`)) return;

        try {
            const res = await fetch('/api/access/ssh?action=revoke', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment: comment })
            });
            const data = await res.json();
            alert(data.message);
            fetchSSHKeys();
        } catch (err) { alert("Failed to revoke key."); }
    }

    // ==========================================
    // ROLE MANAGEMENT LOGIC
    // ==========================================

    async function fetchRolesData() {
        try {
            const res = await fetch('/api/roles');
            if (res.ok) {
                const roles = await res.json();
                const tbody = document.getElementById('list-roles');
                if (!tbody) return;

                tbody.innerHTML = '';
                roles.forEach(r => {
                    const isSystemRole = (r.id === 'admin' || r.id === 'standard');
                    const deleteBtn = isSystemRole 
                        ? `<span class="text-muted-foreground/50 text-xs italic px-3">System</span>` 
                        : `<button onclick="deleteRole('${r.id}', '${r.name}')" class="text-destructive hover:text-white text-xs font-medium bg-background px-3 py-1.5 rounded-lg border border-border hover:bg-destructive hover:border-destructive transition-colors ml-2">Delete</button>`;

                    const editBtn = `<button onclick="editRole('${r.id}', '${r.name}', '${r.allowed_ports}')" class="text-muted-foreground hover:text-white text-xs font-medium bg-background px-3 py-1.5 rounded-lg border border-border hover:bg-primary hover:border-primary transition-colors">Edit</button>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-background/50 transition-colors">
                            <td class="p-5">
                                <div class="font-bold text-slate-200">${r.name}</div>
                                <div class="font-mono text-[10px] text-muted-foreground mt-0.5">${r.id}</div>
                            </td>
                            <td class="p-5 font-mono text-primary font-medium tracking-tight">${r.allowed_ports}</td>
                            <td class="p-5 text-muted-foreground text-xs">${new Date(r.created_at).toLocaleDateString()}</td>
                            <td class="p-5 text-right flex justify-end items-center">
                                ${editBtn}
                                ${deleteBtn}
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (err) { console.error("Error fetching roles:", err); }
    }

    async function createRole() {
        const name = prompt("Enter Role Name (e.g., 'Database Admin'):");
        if (!name) return;
        
        const ports = prompt("Enter Allowed Ports/IPs (e.g., 'ALL', '80,443', or '10.8.0.50:5432'):", "80,443");
        if (!ports) return;

        try {
            const res = await fetch('/api/roles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, allowed_ports: ports })
            });
            const data = await res.json();
            if (res.ok) {
                fetchRolesData(); // Instantly refresh UI!
            } else {
                alert(`Error: ${data.message}`);
            }
        } catch (err) { alert("Failed to create role."); }
    }

    async function editRole(id, currentName, currentPorts) {
        const newName = prompt("Edit Role Name:", currentName);
        if (!newName) return;

        const newPorts = prompt("Edit Allowed Ports/IPs:", currentPorts);
        if (!newPorts) return;

        try {
            const res = await fetch('/api/roles', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, name: newName, allowed_ports: newPorts })
            });
            const data = await res.json();
            if (res.ok) {
                fetchRolesData(); // Instantly refresh UI!
            } else {
                alert(`Error: ${data.message}`);
            }
        } catch (err) { alert("Failed to update role."); }
    }

    async function deleteRole(id, name) {
        if (!confirm(`🚨 Are you sure you want to delete the '${name}' role?\n\nThis will fail if users are currently assigned to it.`)) return;

        try {
            const res = await fetch('/api/roles', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });
            const data = await res.json();
            if (res.ok) {
                fetchRolesData(); // Instantly refresh UI!
            } else {
                alert(`Error: ${data.message}`);
            }
        } catch (err) { alert("Failed to delete role."); }
    }

    // ==========================================
    // GLOBAL ROUTING LOGIC
    // ==========================================
    
    // Global state for the toggle
    let isGlobalRoutingEnabled = false;

    async function fetchNetworkStatus() {
        try {
            const res = await fetch('/api/network/internet');
            if (res.ok) {
                const data = await res.json();
                isGlobalRoutingEnabled = data.internet_enabled;
                updateRoutingUI();
            }
        } catch (err) { console.error("Error fetching network status:", err); }
    }

    function updateRoutingUI() {
        const badge = document.getElementById('badge-routing-status');
        const bg = document.getElementById('btn-toggle-routing');
        const knob = document.getElementById('toggle-routing-knob');

        if (!badge || !bg || !knob) return;

        if (isGlobalRoutingEnabled) {
            badge.className = 'px-2.5 py-0.5 text-[10px] uppercase tracking-widest font-bold rounded-full bg-success/10 text-success border border-success/20';
            badge.innerText = 'Routed';
            bg.className = 'relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background bg-success shrink-0';
            knob.className = 'inline-block h-5 w-5 transform rounded-full bg-white transition-transform translate-x-8 shadow-sm';
        } else {
            badge.className = 'px-2.5 py-0.5 text-[10px] uppercase tracking-widest font-bold rounded-full bg-destructive/10 text-destructive border border-destructive/20';
            badge.innerText = 'Isolated';
            bg.className = 'relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background bg-slate-700 shrink-0';
            knob.className = 'inline-block h-5 w-5 transform rounded-full bg-white transition-transform translate-x-1 shadow-sm';
        }
    }

    async function toggleGlobalRouting() {
        // Optimistically flip the UI state for instant feedback
        isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
        updateRoutingUI();

        try {
            const res = await fetch('/api/network/internet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enable: isGlobalRoutingEnabled })
            });
            const data = await res.json();
            
            if (!res.ok) {
                // Revert if it failed
                alert(`Error: ${data.message}`);
                isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
                updateRoutingUI();
            }
        } catch (err) {
            alert("Network error while toggling routing.");
            isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
            updateRoutingUI();
        }
    }

</script>
