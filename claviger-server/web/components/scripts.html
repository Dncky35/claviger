{{ define "scripts" }}
<script>
    // --- Global State Variables ---
    let lastRxBytes = 0;
    let lastTxBytes = 0;
    let lastTimestamp = 0;

    // --- APP INSTALLER LOGIC ---
    async function installApp(appId, isCustom = false) {
        if (!confirm(`Are you sure you want to install ${appId}?`)) return;

        const installBtn = document.getElementById(`btn-install-${appId}`);
        const originalHtml = installBtn.innerHTML;

        // Fail gracefully if the DOM element isn't found
        if (!installBtn) {
            console.error(`[Orchestrator] DOM target btn-install-${appId} not found.`);
            return;
        }

        // 1. LOADING STATE
        installBtn.disabled = true;
        // Remove primary blue colors
        installBtn.classList.remove('bg-primary', 'hover:bg-blue-600');
        // Add gray, disabled, and pulsing animation classes
        installBtn.classList.add('bg-slate-700', 'cursor-not-allowed', 'animate-pulse');
        installBtn.innerHTML = '⏳ Installing... Please wait';

        try {
            const res = await fetch('/api/apps/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ app_id: appId, is_custom: isCustom })
            });
            const data = await res.json();
            
            if (res.ok && data.status === 'success') {
                // 2. SUCCESS STATE
                installBtn.classList.remove('animate-pulse');
                installBtn.classList.add('bg-emerald-600');
                installBtn.innerHTML = '✅ Installed!';
                
                // Wait 1 second so the user sees the success checkmark, then sync the UI
                setTimeout(() => {
                    syncAppStates(); 
                    if (appId === 'adguard') loadContainers(); // Refresh containers tab in background
                }, 1000);
            } else {
                // Trigger the catch block below
                throw new Error(data.message || "Unknown server error");
            }
        } catch (e) {
            // 3. FAILURE & RETRY STATE
            installBtn.disabled = false;
            installBtn.classList.remove('bg-slate-700', 'cursor-not-allowed', 'animate-pulse');
            // Turn the button red to indicate failure
            installBtn.classList.add('bg-rose-600', 'hover:bg-rose-500'); 
            installBtn.innerHTML = '❌ Failed. Retry?';
            
            // Show the exact reason why it failed (e.g., "Port 53 already in use")
            setTimeout(() => {
                alert(`Installation Failed for ${appId}:\n\n${e.message}\n\nPlease check your server logs.`);
            }, 100);
        }
    }

    async function syncAppStates() {
        try {
            const res = await fetch('/api/containers');
            const data = await res.json();
            
            // If the backend didn't send the registry, abort cleanly
            if (!data.registry_apps) return;

            // --- NEW: Trigger the Uninstall List renderer! ---
            if (typeof renderUninstallList === "function") {
                renderUninstallList(data.registry_apps);
            }

            // 2. NEW: Render the Extensions Marketplace!
            if (typeof renderExtensionsList === "function") {
                renderExtensionsList(data.registry_apps);
            }

            // console.log(`${JSON.stringify(data.registry_apps)} apps found in registry. Syncing UI...`);

            // Loop through EVERY app the Go backend knows about
            data.registry_apps.forEach(app => {

                if (!app.id || app.id === "fail2ban") return; // Sanity check to avoid rendering apps without an ID

                const badge = document.getElementById(`badge-app-${app.id}`);
                const installBtn = document.getElementById(`btn-install-${app.id}`);
                const dashBtn = document.getElementById(`btn-dash-${app.id}`);
                const helperText = document.getElementById(`helper-${app.id}-setup`);

                // If the UI element doesn't exist on this page, just skip it
                if (!badge || !installBtn || !dashBtn) return; 

                if (app.status !== 'not_installed') {
                    // -----------------------------------------
                    // STATE: APP IS INSTALLED
                    // -----------------------------------------
                    installBtn.classList.add('hidden');
                    
                    // Configure the Dashboard/Setup Button
                    if (app.action_port > 0) {
                        dashBtn.classList.remove('hidden');
                        dashBtn.setAttribute('onclick', `window.open('http://' + window.location.hostname + ':${app.action_port}', '_blank')`);
                        dashBtn.innerText = app.action_text;
                    } else {
                        if (app.id === "fail2ban")
                            dashBtn.classList.add('hidden'); // Hide if app has no UI (e.g., Fail2Ban)
                    }

                    if (app.status === 'running') {
                        badge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                        badge.innerText = app.setup_complete ? 'Running' : 'Setup Required';

                        // Smart styling: highlight the button blue if they need to finish setup
                        if (!app.setup_complete) {
                            dashBtn.classList.replace('bg-slate-800', 'bg-primary');
                            if (helperText) helperText.classList.remove('hidden');
                        } else {
                            dashBtn.classList.replace('bg-primary', 'bg-slate-800');
                            if (helperText) helperText.classList.add('hidden');
                        }
                    } else {
                        badge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-warning/10 text-warning border border-warning/20';
                        badge.innerText = 'Stopped';
                    }

                } else {
                    // -----------------------------------------
                    // STATE: APP IS NOT INSTALLED
                    // -----------------------------------------
                    installBtn.classList.remove('hidden');
                    dashBtn.classList.add('hidden');
                    badge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-slate-800 text-slate-400 border border-slate-700';
                    badge.innerText = 'Not Installed';
                    if (helperText) helperText.classList.add('hidden');
                }
            });
        } catch (e) {
            console.error("Failed to sync app states", e);
        }
    }

    // --- Tab Navigation Logic ---
    function switchTab(tabId) {
        const tabs = ['system', 'security', 'clients', "voice", "access", "roles", "mfa", "containers", "network", "uninstall", "extensions"];
        
        // New Sidebar Tailwind CSS states
        const inactiveClass = 'px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors';
        const activeClass = 'px-3 py-2 w-full text-left rounded-lg text-sm font-medium bg-primary/10 text-primary transition-colors';

        tabs.forEach(id => {
            const tabEl = document.getElementById('tab-' + id);
            const btnEl = document.getElementById('btn-' + id);
            
            // Hide all tab content
            if (tabEl) {
                tabEl.classList.add('hidden');
                tabEl.classList.remove('block');
            }
            // Reset all buttons to inactive
            if (btnEl) {
                // 🎯 THE FIX: Check if it's hidden before wiping the classes!
                const isHidden = btnEl.classList.contains('hidden');
                
                btnEl.className = inactiveClass;
                
                // If it was hidden, put the hidden class back!
                if (isHidden) {
                    btnEl.classList.add('hidden');
                }
            }
        });
        
        const activeTab = document.getElementById('tab-' + tabId);
        const activeBtn = document.getElementById('btn-' + tabId);
        
        // Show selected tab content
        if (activeTab) {
            activeTab.classList.remove('hidden');
            activeTab.classList.add('block');
        }
        // Highlight selected button
        if (activeBtn) {
            // 🎯 THE FIX: Preserve hidden state here too just in case
            const isHidden = activeBtn.classList.contains('hidden');
            activeBtn.className = activeClass;
            if (isHidden) activeBtn.classList.add('hidden');
        }
        
        // Fetch fresh data immediately when switching to a tab
        if (tabId === 'network') { fetchNetworkStatus(); syncAppStates(); }
        if (tabId === 'security') { fetchSecurityData(); fetchFail2BanStatus(); }
        if (tabId === 'clients') fetchPeersData();
        if (tabId === 'access') fetchSSHKeys();
        if (tabId === 'roles') fetchRolesData();
        if (tabId === 'uninstall') { syncAppStates(); }
        if (tabId === 'containers') loadContainers();
        if (tabId === 'extensions') { syncAppStates(); }
        if (tabId === 'system') {
            fetchSystemSettings();
            fetchSystemTasks();
        }
        if (tabId === "voice" ) {
            loadVoiceSettings();
        }
        if (tabId === "mfa") {
            
        }
    }
    
    // Global state for the toggle
    let isGlobalRoutingEnabled = false;

    async function fetchNetworkStatus() {
        try {
            const res = await fetch('/api/network/internet');
            if (res.ok) {
                const data = await res.json();
                isGlobalRoutingEnabled = data.internet_enabled;
                updateRoutingUI();
            }
        } catch (err) { console.error("Error fetching network status:", err); }
    }

    function updateRoutingUI() {
        const badge = document.getElementById('badge-routing-status');
        const bg = document.getElementById('btn-toggle-routing');
        const knob = document.getElementById('toggle-routing-knob');

        if (!badge || !bg || !knob) return;

        if (isGlobalRoutingEnabled) {
            badge.className = 'px-2.5 py-0.5 text-[10px] uppercase tracking-widest font-bold rounded-full bg-success/10 text-success border border-success/20';
            badge.innerText = 'Routed';
            bg.className = 'relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background bg-success shrink-0';
            knob.className = 'inline-block h-5 w-5 transform rounded-full bg-white transition-transform translate-x-8 shadow-sm';
        } else {
            badge.className = 'px-2.5 py-0.5 text-[10px] uppercase tracking-widest font-bold rounded-full bg-destructive/10 text-destructive border border-destructive/20';
            badge.innerText = 'Isolated';
            bg.className = 'relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background bg-slate-700 shrink-0';
            knob.className = 'inline-block h-5 w-5 transform rounded-full bg-white transition-transform translate-x-1 shadow-sm';
        }
    }

    async function toggleGlobalRouting() {
        // Optimistically flip the UI state for instant feedback
        isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
        updateRoutingUI();

        try {
            const res = await fetch('/api/network/internet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enable: isGlobalRoutingEnabled })
            });
            const data = await res.json();
            
            if (!res.ok) {
                // Revert if it failed
                alert(`Error: ${data.message}`);
                isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
                updateRoutingUI();
            }
        } catch (err) {
            alert("Network error while toggling routing.");
            isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
            updateRoutingUI();
        }
    }

    // --- STEP-UP MODAL CONTROLLER ---
const StepUpController = {
    pendingResolve: null,
    pendingReject: null,

    show: function() {
        return new Promise((resolve, reject) => {
            this.pendingResolve = resolve;
            this.pendingReject = reject;
            
            const modal = document.getElementById('stepup-modal');
            const content = document.getElementById('stepup-modal-content');
            const input = document.getElementById('stepup-code-input');
            
            // Reset UI
            input.value = '';
            document.getElementById('stepup-error-msg').classList.add('hidden');
            
            // Show Modal with animation
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                input.focus();
            });
        });
    },

    hide: function(success) {
        const modal = document.getElementById('stepup-modal');
        const content = document.getElementById('stepup-modal-content');
        
        // Animate out
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            if (success && this.pendingResolve) this.pendingResolve(true);
            if (!success && this.pendingReject) this.pendingReject(new Error("Step-up cancelled by user"));
        }, 300); // Matches the Tailwind duration-300
    },

    verify: async function() {
        const code = document.getElementById('stepup-code-input').value.trim();
        const errorEl = document.getElementById('stepup-error-msg');
        const btn = document.getElementById('btn-stepup-verify');

        if (!code) return;

        errorEl.classList.add('hidden');
        btn.innerHTML = '⏳...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/mfa/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code }) 
            });
            
            const data = await res.json();
            
            if (res.ok && data.success) {
                // We got the secure cookie! Hide modal and resolve true.
                this.hide(true);
            } else {
                throw new Error(data.message || "Invalid code");
            }
        } catch (e) {
            errorEl.textContent = e.message;
            errorEl.classList.remove('hidden');
        } finally {
            btn.innerHTML = 'Verify';
            btn.disabled = false;
        }
    }
};

// --- EVENT LISTENERS FOR MODAL ---
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-stepup-cancel').addEventListener('click', () => StepUpController.hide(false));
    document.getElementById('btn-stepup-verify').addEventListener('click', () => StepUpController.verify());
    document.getElementById('stepup-code-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') StepUpController.verify();
    });
});

// --- THE GLOBAL FETCH INTERCEPTOR ---
// We store the original browser fetch function
const originalFetch = window.fetch;

// We override it with our own Zero Trust wrapper
window.fetch = async function(...args) {
    // 1. Make the normal network request
    let response = await originalFetch(...args);
    
    // 2. Did the Go backend hit our StepUpMiddleware?
    if (response.status === 401) {
        // Clone the response so we can safely read the JSON body
        const clone = response.clone();
        try {
            const data = await clone.json();
            
            if (data.requires_stepup) {
                console.log("🔒 Elevated privileges required. Pausing fetch and showing Step-Up UI.");
                
                try {
                    // 3. Wait for the user to type their TOTP code in the modal
                    await StepUpController.show();
                    
                    // 4. If we get here, StepUpController resolved successfully!
                    // Retry the EXACT same original API request automatically.
                    console.log("🔓 Step-Up successful. Resuming original request.");
                    response = await originalFetch(...args);
                } catch (cancelError) {
                    // User clicked "Cancel Action" on the modal
                    console.log(cancelError.message);
                }
            }
        } catch (parseError) {
            // It was a 401, but not our JSON step-up payload. Ignore.
        }
    }
    
    // 5. Return the final response back to whatever frontend function called it
    return response;
};

</script>
