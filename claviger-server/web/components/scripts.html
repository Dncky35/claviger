<script>
    // --- Global State Variables ---
    let lastRxBytes = 0;
    let lastTxBytes = 0;
    let lastTimestamp = 0;

    // --- APP INSTALLER LOGIC ---
    async function installApp(appId) {
        if (!confirm(`Are you sure you want to install ${appId}?`)) return;

        const installBtn = document.getElementById(`btn-install-${appId}`);
        const originalHtml = installBtn.innerHTML;

        // 1. LOADING STATE
        installBtn.disabled = true;
        // Remove primary blue colors
        installBtn.classList.remove('bg-primary', 'hover:bg-blue-600');
        // Add gray, disabled, and pulsing animation classes
        installBtn.classList.add('bg-slate-700', 'cursor-not-allowed', 'animate-pulse');
        installBtn.innerHTML = '⏳ Installing... Please wait';

        try {
            const res = await fetch('/api/apps/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ app_id: appId })
            });
            const data = await res.json();
            
            if (res.ok && data.status === 'success') {
                // 2. SUCCESS STATE
                installBtn.classList.remove('animate-pulse');
                installBtn.classList.add('bg-emerald-600');
                installBtn.innerHTML = '✅ Installed!';
                
                // Wait 1 second so the user sees the success checkmark, then sync the UI
                setTimeout(() => {
                    syncAppStates(); 
                    if (appId === 'adguard') loadContainers(); // Refresh containers tab in background
                }, 1000);
            } else {
                // Trigger the catch block below
                throw new Error(data.message || "Unknown server error");
            }
        } catch (e) {
            // 3. FAILURE & RETRY STATE
            installBtn.disabled = false;
            installBtn.classList.remove('bg-slate-700', 'cursor-not-allowed', 'animate-pulse');
            // Turn the button red to indicate failure
            installBtn.classList.add('bg-rose-600', 'hover:bg-rose-500'); 
            installBtn.innerHTML = '❌ Failed. Retry?';
            
            // Show the exact reason why it failed (e.g., "Port 53 already in use")
            setTimeout(() => {
                alert(`Installation Failed for ${appId}:\n\n${e.message}\n\nPlease check your server logs.`);
            }, 100);
        }
    }

    // --- APP STORE STATE MANAGER ---
    async function syncAppStates() {
        try {
            const res = await fetch('/api/containers');
            const data = await res.json();
            
            // List of apps we track in our UI
            const trackedApps = ['adguard', 'fail2ban'];

            trackedApps.forEach(appName => {
                const badge = document.getElementById(`badge-app-${appName}`);
                const installBtn = document.getElementById(`btn-install-${appName}`);
                const dashBtn = document.getElementById(`btn-dash-${appName}`);

                if (!badge || !installBtn || !dashBtn) return; 

                // 1. Check if it's a Docker app
                let isInstalled = false;
                let appState = 'not_installed';

                if (data.docker_installed && data.containers) {
                    const container = data.containers.find(c => c.name === appName);
                    if (container) {
                        isInstalled = true;
                        appState = container.state;
                    }
                }

                // 2. Check if it's a Native app (overrides Docker check if found)
                if (data.native_apps && data.native_apps[appName] && data.native_apps[appName] !== 'not_installed') {
                    isInstalled = true;
                    appState = data.native_apps[appName];
                }

                // 3. Update the UI based on state
                if (isInstalled) {
                    installBtn.classList.add('hidden');
                    dashBtn.classList.remove('hidden');
                    
                    if (appState === 'running') {
                        badge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                        badge.innerText = 'Running';
                    } else {
                        badge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-warning/10 text-warning border border-warning/20';
                        badge.innerText = 'Stopped';
                    }

                    // --- NEW: SMART ROUTING FOR ADGUARD ---
                    if (appName === 'adguard') {
                        const agBtn = document.getElementById('btn-dash-adguard');
                        const agBadge = document.getElementById('badge-app-adguard');

                        if (data.adguard_setup) {
                            // Setup is done -> Route to Main Dashboard
                            agBtn.setAttribute('onclick', "window.open('http://' + window.location.hostname + ':8083', '_blank')");
                            agBtn.innerText = "Open Dashboard ↗";
                            agBtn.classList.replace('bg-primary', 'bg-slate-800'); // Standard button color
                            agBadge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                            agBadge.innerText = 'Setup Complete';
                        } else {
                            // Setup needed -> Route to Wizard
                            agBtn.setAttribute('onclick', "window.open('http://' + window.location.hostname + ':3030', '_blank')");
                            agBtn.innerText = "Finish Setup ↗";
                            agBtn.classList.replace('bg-slate-800', 'bg-primary'); // Highlight blue so they know to click it!
                            agBadge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-warning/10 text-warning border border-warning/20';
                            agBadge.innerText = "When setup is complete, ignore AdGuard's final button and just close the tab.";
                        }
                    }


                } else {
                    installBtn.classList.remove('hidden');
                    dashBtn.classList.add('hidden');
                    badge.className = 'px-2.5 py-0.5 text-[10px] uppercase font-bold rounded-full bg-slate-800 text-slate-400 border border-slate-700';
                    badge.innerText = 'Not Installed';
                }
            });
        } catch (e) {
            console.error("Failed to sync app states", e);
        }
    }

    // --- Tab Navigation Logic ---
    function switchTab(tabId) {
        const tabs = ['system', 'security', 'clients', "access", "roles", "containers", "network"];
        
        // New Sidebar Tailwind CSS states
        const inactiveClass = 'px-3 py-2 w-full text-left rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition-colors';
        const activeClass = 'px-3 py-2 w-full text-left rounded-lg text-sm font-medium bg-primary/10 text-primary transition-colors';

        tabs.forEach(id => {
            const tabEl = document.getElementById('tab-' + id);
            const btnEl = document.getElementById('btn-' + id);
            
            // Hide all tab content
            if (tabEl) {
                tabEl.classList.add('hidden');
                tabEl.classList.remove('block');
            }
            // Reset all buttons to inactive
            if (btnEl) {
                btnEl.className = inactiveClass;
            }
        });
        
        const activeTab = document.getElementById('tab-' + tabId);
        const activeBtn = document.getElementById('btn-' + tabId);
        
        // Show selected tab content
        if (activeTab) {
            activeTab.classList.remove('hidden');
            activeTab.classList.add('block');
        }
        // Highlight selected button
        if (activeBtn) {
            activeBtn.className = activeClass;
        }
        
        // Fetch fresh data immediately when switching to a tab
        if (tabId === 'network') { fetchNetworkStatus(); syncAppStates(); }
        if (tabId === 'security') { fetchSecurityData(); syncAppStates(); }
        if (tabId === 'clients') fetchPeersData();
        if (tabId === 'access') fetchSSHKeys();
        if (tabId === 'roles') fetchRolesData();
        if (tabId === 'containers') loadContainers();
        if (tabId === 'system') {
            fetchSystemSettings();
            fetchSystemTasks();
        }
    }

    // ==========================================
    // GLOBAL ROUTING LOGIC
    // ==========================================
    
    // Global state for the toggle
    let isGlobalRoutingEnabled = false;

    async function fetchNetworkStatus() {
        try {
            const res = await fetch('/api/network/internet');
            if (res.ok) {
                const data = await res.json();
                isGlobalRoutingEnabled = data.internet_enabled;
                updateRoutingUI();
            }
        } catch (err) { console.error("Error fetching network status:", err); }
    }

    function updateRoutingUI() {
        const badge = document.getElementById('badge-routing-status');
        const bg = document.getElementById('btn-toggle-routing');
        const knob = document.getElementById('toggle-routing-knob');

        if (!badge || !bg || !knob) return;

        if (isGlobalRoutingEnabled) {
            badge.className = 'px-2.5 py-0.5 text-[10px] uppercase tracking-widest font-bold rounded-full bg-success/10 text-success border border-success/20';
            badge.innerText = 'Routed';
            bg.className = 'relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background bg-success shrink-0';
            knob.className = 'inline-block h-5 w-5 transform rounded-full bg-white transition-transform translate-x-8 shadow-sm';
        } else {
            badge.className = 'px-2.5 py-0.5 text-[10px] uppercase tracking-widest font-bold rounded-full bg-destructive/10 text-destructive border border-destructive/20';
            badge.innerText = 'Isolated';
            bg.className = 'relative inline-flex h-7 w-14 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background bg-slate-700 shrink-0';
            knob.className = 'inline-block h-5 w-5 transform rounded-full bg-white transition-transform translate-x-1 shadow-sm';
        }
    }

    async function toggleGlobalRouting() {
        // Optimistically flip the UI state for instant feedback
        isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
        updateRoutingUI();

        try {
            const res = await fetch('/api/network/internet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enable: isGlobalRoutingEnabled })
            });
            const data = await res.json();
            
            if (!res.ok) {
                // Revert if it failed
                alert(`Error: ${data.message}`);
                isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
                updateRoutingUI();
            }
        } catch (err) {
            alert("Network error while toggling routing.");
            isGlobalRoutingEnabled = !isGlobalRoutingEnabled;
            updateRoutingUI();
        }
    }
