{{ define "tab_fleet" }}
<div id="tab-fleet" class="tab-pane hidden">
    
    <!-- Header & Dropdown -->
    <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-white">Fleet Nodes</h2>
            <p class="text-slate-400 text-sm mt-1">Manage and monitor your remote edge servers.</p>
        </div>
        
        <div id="fleet-selector-container" class="hidden flex items-center gap-3">
            <label for="fleet-node-select" class="text-xs font-bold uppercase tracking-widest text-slate-500">Target Node:</label>
            <div class="relative min-w-[200px]">
                <select id="fleet-node-select" onchange="onNodeSelected()" class="appearance-none bg-surface border border-border text-slate-200 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full py-2 pl-4 pr-10 shadow-sm cursor-pointer outline-none transition-colors">
                    <option value="">Select a node...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div id="fleet-empty-state" class="hidden bg-surface border border-border rounded-2xl p-12 text-center shadow-sm">
        <div class="w-16 h-16 bg-slate-800/50 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        </div>
        <h3 class="text-lg font-bold text-white mb-2">No Sub-Servers Found</h3>
        <p class="text-slate-400 max-w-md mx-auto mb-6">You haven't paired any remote nodes yet.</p>
    </div>

    <!-- Node Dashboard Content -->
    <div id="fleet-node-dashboard" class="hidden">
        
        <!-- Identity Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-surface p-5 rounded-xl border border-border shadow-sm">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">Node Status</h3>
                <div id="node-stat-status" class="text-lg font-bold text-slate-200 flex items-center gap-2">-</div>
            </div>
            <div class="bg-surface p-5 rounded-xl border border-border shadow-sm">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">VPN Tunnel IP</h3>
                <div id="node-stat-ip" class="text-lg font-mono font-bold text-slate-200">-</div>
            </div>
        </div>

        <!-- Hardware Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- CPU -->
            <div class="bg-surface p-6 rounded-2xl border border-border shadow-sm">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">CPU Usage</h3>
                <div id="fleet-sys-cpu-val" class="text-2xl font-bold text-slate-200 mb-2">-%</div>
                <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div id="fleet-sys-cpu-bar" class="bg-primary h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- RAM -->
            <div class="bg-surface p-6 rounded-2xl border border-border shadow-sm">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">RAM Usage</h3>
                <div id="fleet-sys-ram-val" class="text-2xl font-bold text-slate-200 mb-2">-%</div>
                <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div id="fleet-sys-ram-bar" class="bg-primary h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div id="fleet-sys-ram-text" class="text-[10px] text-slate-400 mt-2 font-mono">-- / -- GB</div>
            </div>
            
            <!-- Disk -->
            <div class="bg-surface p-6 rounded-2xl border border-border shadow-sm">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">Disk Usage</h3>
                <div id="fleet-sys-disk-val" class="text-2xl font-bold text-slate-200 mb-2">-%</div>
                <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div id="fleet-sys-disk-bar" class="bg-primary h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div id="fleet-sys-disk-text" class="text-[10px] text-slate-400 mt-2 font-mono">-- / -- GB</div>
            </div>
            
            <!-- System Info -->
            <div class="bg-surface p-6 rounded-2xl border border-border shadow-sm">
                <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">System Info</h3>
                <div id="fleet-sys-os" class="text-sm font-bold text-slate-200 truncate">-</div>
                <div id="fleet-sys-uptime" class="text-[11px] text-slate-400 mt-1">-</div>
            </div>
        </div>

    </div>

    <script>
        let fleetPollingInterval = null;

        async function loadFleetNodes() {
            try {
                const res = await fetch('/api/sub-servers');
                if (!res.ok) return;
                const nodes = await res.json();
                
                const emptyState = document.getElementById('fleet-empty-state');
                const selectorContainer = document.getElementById('fleet-selector-container');
                const nodeSelect = document.getElementById('fleet-node-select');
                const dashboard = document.getElementById('fleet-node-dashboard');

                if (!nodes || nodes.length === 0) {
                    emptyState.classList.remove('hidden');
                    selectorContainer.classList.add('hidden');
                    dashboard.classList.add('hidden');
                    return;
                } 
                
                emptyState.classList.add('hidden');
                selectorContainer.classList.remove('hidden');
                nodeSelect.innerHTML = '<option value="">Select a node...</option>';
                
                nodes.forEach(node => {
                    const opt = document.createElement('option');
                    opt.value = node.id;
                    opt.textContent = node.status === 'pending' ? node.name + ' (Pending)' : node.name;
                    opt.dataset.nodeInfo = JSON.stringify(node);
                    nodeSelect.appendChild(opt);
                });
            } catch (error) {
                console.error('Error fetching fleet nodes:', error);
            }
        }

        function onNodeSelected() {
            const select = document.getElementById('fleet-node-select');
            const dashboard = document.getElementById('fleet-node-dashboard');
            
            // Clear any existing polling loop
            if (fleetPollingInterval) clearInterval(fleetPollingInterval);

            if (!select.value) {
                dashboard.classList.add('hidden');
                return;
            }

            const selectedOption = select.options[select.selectedIndex];
            const node = JSON.parse(selectedOption.dataset.nodeInfo);
            dashboard.classList.remove('hidden');

            const statusEl = document.getElementById('node-stat-status');
            if (node.status === 'active') {
                statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse shadow-[0_0_8px_rgba(129,140,248,0.6)]"></div> <span class="text-indigo-400">Active Node</span>';
                
                // Immediately fetch hardware stats, then set an interval
                fetchFleetNodeSystemData(node.id);
                fleetPollingInterval = setInterval(() => fetchFleetNodeSystemData(node.id), 5000);
            } else {
                statusEl.innerHTML = '<div class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div> <span class="text-amber-400">Pending Approval</span>';
                // Reset stats to dashed state if pending
                resetFleetStats();
            }

            document.getElementById('node-stat-ip').textContent = node.ip_address || 'Unknown';
        }

        // The Proxy Fetch Function
        async function fetchFleetNodeSystemData(nodeId) {
            try {
                // Notice the URL points to our proxy, and we send the Target Node ID in the header
                const sysRes = await fetch('/api/fleet/proxy/api/system', {
                    headers: {
                        'X-Node-ID': nodeId
                    }
                });
                
                if (sysRes.ok) {
                    const sys = await sysRes.json();
                    
                    const safeSet = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
                    const safeStyle = (id, prop, val) => { const el = document.getElementById(id); if (el) el.style[prop] = val; };

                    safeSet('fleet-sys-cpu-val', sys.cpu_percent + '%');
                    safeStyle('fleet-sys-cpu-bar', 'width', sys.cpu_percent + '%');
                    
                    safeSet('fleet-sys-ram-val', sys.ram_percent + '%');
                    safeStyle('fleet-sys-ram-bar', 'width', sys.ram_percent + '%');
                    safeSet('fleet-sys-ram-text', sys.ram_used_gb + ' / ' + sys.ram_total_gb + ' GB');
                    
                    safeSet('fleet-sys-disk-val', sys.disk_percent + '%');
                    safeStyle('fleet-sys-disk-bar', 'width', sys.disk_percent + '%');
                    safeSet('fleet-sys-disk-text', sys.disk_used_gb + ' / ' + sys.disk_total_gb + ' GB');
                    
                    safeSet('fleet-sys-os', sys.os_name);
                    safeSet('fleet-sys-uptime', sys.uptime);
                }
            } catch (err) { 
                console.error("Error fetching remote node system info:", err); 
            }
        }

        function resetFleetStats() {
            const safeSet = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
            const safeStyle = (id, prop, val) => { const el = document.getElementById(id); if (el) el.style[prop] = val; };
            
            safeSet('fleet-sys-cpu-val', '-%'); safeStyle('fleet-sys-cpu-bar', 'width', '0%');
            safeSet('fleet-sys-ram-val', '-%'); safeStyle('fleet-sys-ram-bar', 'width', '0%');
            safeSet('fleet-sys-ram-text', '-- / -- GB');
            safeSet('fleet-sys-disk-val', '-%'); safeStyle('fleet-sys-disk-bar', 'width', '0%');
            safeSet('fleet-sys-disk-text', '-- / -- GB');
            safeSet('fleet-sys-os', '-'); safeSet('fleet-sys-uptime', '-');
        }

        loadFleetNodes();
    </script>
</div>
{{ end }}
