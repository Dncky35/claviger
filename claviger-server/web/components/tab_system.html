{{ define "tab_system" }}
<div id="tab-system" class="space-y-6 block animate-fade-in">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
            <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-4">CPU Usage</h3>
            <div class="flex items-end justify-between mb-2">
                <span id="sys-cpu-val" class="text-3xl font-bold text-white">--%</span>
                <span id="sys-cpu-cores" class="text-sm text-gray-400">-- Cores</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2 mt-4 overflow-hidden">
                <div id="sys-cpu-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
            <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-4">Memory</h3>
            <div class="flex items-end justify-between mb-2">
                <span id="sys-ram-val" class="text-3xl font-bold text-white">--%</span>
                <span id="sys-ram-text" class="text-sm text-gray-400">-- / -- GB</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2 mt-4 overflow-hidden">
                <div id="sys-ram-bar" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
            <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-4">Storage (/)</h3>
            <div class="flex items-end justify-between mb-2">
                <span id="sys-disk-val" class="text-3xl font-bold text-white">--%</span>
                <span id="sys-disk-text" class="text-sm text-gray-400">-- / -- GB</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2 mt-4 overflow-hidden">
                <div id="sys-disk-bar" class="bg-purple-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl">
            <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-4">Network Traffic</h3>
            <div class="space-y-3 mt-2">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400 flex items-center"><span class="text-green-400 mr-2 font-bold">↓</span> Download</span>
                    <span id="sys-net-down" class="font-bold text-white font-mono">0.00 MB/s</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400 flex items-center"><span class="text-blue-400 mr-2 font-bold">↑</span> Upload</span>
                    <span id="sys-net-up" class="font-bold text-white font-mono">0.00 MB/s</span>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
        
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-xl overflow-hidden col-span-1 p-6">
            <h3 class="text-gray-400 text-sm font-medium uppercase tracking-wider mb-4">Node Info</h3>
            <div class="space-y-4">
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Operating System</p>
                    <p class="text-white font-medium mt-1" id="sys-os">Loading...</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-wide">System Uptime</p>
                    <p class="text-white font-medium mt-1" id="sys-uptime">--</p>
                </div>
                <div class="pt-4 border-t border-gray-700">
                    <p class="text-xs text-gray-500 flex items-center justify-between">
                        <span>Daemon Version</span>
                        <span class="font-mono text-gray-300">v1.0.0-edge</span>
                    </p>
                </div>
            </div>
        </div>
        
    </div>
</div>
{{ end }}
