{{ define "tab_extensions" }}
<div id="tab-extensions" class="hidden space-y-6 animate-fade-in">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-3xl font-bold text-foreground tracking-tight">{{ T "extensions.title" }}</h2>
            <p class="text-muted-foreground text-sm mt-1">{{ T "extensions.subtitle" }}</p>
        </div>
        
        <!-- Sync Button -->
        <button id="sync-catalog-btn" class="flex items-center gap-2 bg-surface-elevated hover:bg-surface-hover text-foreground px-4 py-2 rounded-md text-sm font-medium transition-colors border border-border disabled:opacity-50 disabled:cursor-not-allowed">
            <svg id="sync-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 21v-5h5"></path>
            </svg>
            <span id="sync-text">Sync Catalog</span>
        </button>
    </div>

    <!-- The Marketplace Grid (JS will inject cards here) -->
    <div id="extensions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Cards will be dynamically injected here -->
    </div>

    <div id="custom-app-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity">
        <div class="bg-surface border border-border rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col">
            
            <div class="p-6 border-b border-border flex justify-between items-center bg-surface/70">
                <div>
                    <h2 class="text-xl font-bold text-foreground flex items-center gap-2">
                        {{ T "extensions.modal_title" }}
                    </h2>
                    <p class="text-sm text-muted-foreground mt-1">{{ T "extensions.modal_desc" }}</p>
                </div>
                <button onclick="closeCustomAppModal()" class="text-muted-foreground hover:text-destructive transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="custom-app-form" onsubmit="submitCustomApp(event)" class="p-6 space-y-4 overflow-y-auto max-h-[70vh]">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-muted-foreground uppercase tracking-wider mb-2">{{ T "extensions.label_name" }}</label>
                        <input type="text" id="custom-app-name" required placeholder="" class="w-full bg-background border border-border rounded-lg px-4 py-2 text-foreground focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-muted-foreground uppercase tracking-wider mb-2">{{ T "extensions.label_emoji" }}</label>
                            <input type="text" id="custom-app-icon" placeholder="" maxlength="2" class="w-full bg-background border border-border rounded-lg px-4 py-2 text-foreground text-center focus:border-primary outline-none transition-all">
                        </div>
                    </div>

                    <div class="mb-4 col-span-full">
                        <label class="block text-sm font-medium text-foreground mb-2">{{ T "extensions.net_config" }}</label>
                        
                        <div class="flex items-center mb-2">
                            <input type="checkbox" id="custom-app-dynamic-port" checked class="w-4 h-4 text-primary bg-surface-elevated border-border rounded focus:ring-primary focus:ring-2">
                            <label for="custom-app-dynamic-port" class="ml-2 text-sm font-medium text-foreground">
                                {{ T "extensions.dynamic_port" }}
                            </label>
                        </div>

                        <div class="flex items-center mb-2">
                            <input type="checkbox" id="custom-app-needs-setup" onchange="toggleSetupPortField()" class="w-4 h-4 text-primary bg-surface-elevated border-border rounded focus:ring-primary focus:ring-2">
                            <label for="custom-app-needs-setup" class="ml-2 text-sm font-medium text-foreground">
                                {{ T "extensions.needs_setup" }}
                            </label>
                        </div>

                        <div id="setup-port-container" class="hidden mt-2 ml-6">
                            <label class="block text-xs font-medium text-muted-foreground mb-1">{{ T "extensions.setup_port_label" }}</label>
                            <input type="number" id="custom-app-setup-port" placeholder="" class="bg-surface-elevated border border-border text-foreground text-sm rounded-lg focus:ring-primary focus:border-primary block w-1/3 p-2.5">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-muted-foreground uppercase tracking-wider mb-2">{{ T "extensions.label_desc" }}</label>
                    <input type="text" id="custom-app-desc" required placeholder="" class="w-full bg-background border border-border rounded-lg px-4 py-2 text-foreground focus:border-primary outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-primary uppercase tracking-wider mb-2 flex items-center justify-between">
                        <span>{{ T "extensions.yaml_label" }}</span>
                        <span class="text-[10px] text-muted-foreground normal-case">{{ T "extensions.yaml_hint" }}</span>
                    </label>
                    <textarea id="custom-app-yaml" required rows="8" placeholder="" class="w-full bg-background border border-border rounded-lg px-4 py-3 text-foreground font-mono text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"></textarea>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeCustomAppModal()" class="w-1/3 py-2.5 bg-surface-elevated hover:bg-surface-hover text-foreground text-sm font-bold rounded-lg transition-colors border border-border">
                        {{ T "extensions.btn_cancel" }}
                    </button>
                    <button type="submit" id="btn-submit-custom" class="w-2/3 py-2.5 bg-primary hover:bg-primary-hover text-primary-foreground text-sm font-bold rounded-lg transition-colors shadow-lg shadow-black/20 flex items-center justify-center gap-2">
                        {{ T "extensions.btn_deploy_custom" }}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Set dynamic placeholders on load
        document.addEventListener('DOMContentLoaded', () => {
            const i18nExt = window.I18N.extensions;
            if (i18nExt) {
                const elName = document.getElementById('custom-app-name');
                const elIcon = document.getElementById('custom-app-icon');
                const elSetupPort = document.getElementById('custom-app-setup-port');
                const elDesc = document.getElementById('custom-app-desc');
                const elYaml = document.getElementById('custom-app-yaml');

                if (elName) elName.placeholder = i18nExt.placeholder_name;
                if (elIcon) elIcon.placeholder = i18nExt.placeholder_emoji;
                if (elSetupPort) elSetupPort.placeholder = i18nExt.placeholder_port;
                if (elDesc) elDesc.placeholder = i18nExt.placeholder_desc;
                if (elYaml) elYaml.placeholder = i18nExt.yaml_placeholder;
            }

            const syncBtn = document.getElementById('sync-catalog-btn');
            if (!syncBtn) return;

            syncBtn.addEventListener('click', async (e) => {
                const icon = document.getElementById('sync-icon');
                const text = document.getElementById('sync-text');

                // 1. Set Loading State
                syncBtn.disabled = true;
                icon.classList.add('animate-spin'); // Tailwind utility to spin the icon
                text.textContent = 'Syncing...';

                try {
                    // 2. Call our new API endpoint
                    const response = await fetch('/api/apps/sync', { 
                        method: 'POST' 
                    });
                    const data = await response.json();

                    // 3. Handle the response
                    if (response.ok && data.status !== 'error') {
                        // Show success (use your custom toast function if you have one instead of alert)
                        alert(data.message); 

                        // If new apps were actually downloaded, refresh the page to show them!
                        if (data.status === 'updated') {
                            // window.location.reload();
                            await syncAppStates();
                        }
                    } else {
                        alert('Error: ' + (data.message || 'Failed to sync catalog'));
                    }
                } catch (error) {
                    console.error(error);
                    alert('Network error occurred while syncing.');
                } finally {
                    // 4. Reset Button State
                    syncBtn.disabled = false;
                    icon.classList.remove('animate-spin');
                    text.textContent = 'Sync Catalog';
                }
            });
        });

        function renderExtensionsList(notInstalledApps) {
            const i18nExt = window.I18N.extensions;
            const gridEl = document.getElementById('extensions-grid');
            if (!gridEl) return;
            gridEl.innerHTML = ''; 

            // Both categories only contain uninstalled apps now
            const officialApps = notInstalledApps.filter(app => app.category === 'optional' && !app.is_custom);
            const customApps = notInstalledApps.filter(app => app.category === 'optional' && app.is_custom);

            const buildCard = (app) => {
                const borderStyle = app.is_custom ? 'border-primary/40' : 'border-border';
                const customPill = app.is_custom ? `<span class="ml-2 px-1.5 py-0.5 rounded text-[9px] font-bold bg-primary/10 text-primary uppercase tracking-wider">${i18nExt.custom_pill}</span>` : '';

                return `
                <div class="bg-surface rounded-2xl border ${borderStyle} overflow-hidden flex flex-col transition-all hover:border-border hover:shadow-lg hover:shadow-black/20 group relative">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none group-hover:bg-primary/15 transition-colors"></div>
                    
                    <div class="p-6 flex-grow z-10">
                        <div class="flex items-start justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl bg-surface-elevated border border-border flex items-center justify-center text-2xl shadow-inner">
                                ${app.icon}
                            </div>
                            
                            <span class="px-2 py-0.5 text-[10px] uppercase font-bold rounded bg-surface-elevated text-muted-foreground border border-border">
                                ${i18nExt.badge_not_installed}
                            </span>
                            
                            <button id="btn-remove-${app.id}" 
                                onclick="removeCustomApp('${app.id}')" 
                                class="${app.is_custom ? '' : 'hidden'} text-destructive hover:text-destructive transition-colors text-sm font-bold">
                                ${i18nExt.btn_remove}
                            </button>
                        </div>
                        
                        <h3 class="text-lg font-bold text-foreground mb-2 flex items-center">${app.name} ${customPill}</h3>
                        <p class="text-sm text-muted-foreground leading-relaxed">${app.description}</p>
                    </div>

                    <div class="p-4 bg-surface/70 border-t border-border z-10 flex gap-2">
                        <button 
                            id="btn-install-${app.id}" 
                            onclick="installApp('${app.id}', ${app.is_custom})" 
                            class="w-full py-2.5 bg-primary hover:bg-primary-hover text-primary-foreground text-sm font-bold rounded-lg transition-colors shadow-sm"
                        >
                            ${i18nExt.btn_install}
                        </button>
                    </div>
                </div>`;
            };

            if (officialApps.length > 0) {
                officialApps.forEach(app => gridEl.insertAdjacentHTML('beforeend', buildCard(app)));
            }

            const addAppCard = `
            <div onclick="openCustomAppModal()" class="bg-surface/30 rounded-2xl border border-dashed border-border overflow-hidden flex flex-col items-center justify-center transition-all hover:border-primary hover:bg-surface hover:shadow-lg group cursor-pointer p-6 min-h-[220px]">
                <div class="w-14 h-14 rounded-full bg-surface-elevated border border-border flex items-center justify-center text-2xl shadow-inner text-muted-foreground group-hover:text-primary group-hover:border-primary/50 transition-colors mb-4">
                    ➕
                </div>
                <h3 class="text-lg font-bold text-muted-foreground group-hover:text-foreground transition-colors">${i18nExt.add_card_title}</h3>
                <p class="text-sm text-muted-foreground text-center mt-2 group-hover:text-muted-foreground">${i18nExt.add_card_desc}</p>
            </div>`;
            gridEl.insertAdjacentHTML('beforeend', addAppCard);

            if (customApps.length > 0) {
                gridEl.insertAdjacentHTML('beforeend', `
                    <div class="col-span-full mt-8 mb-2 border-b border-border pb-2">
                        <h3 class="text-xl font-bold text-muted-foreground">${i18nExt.deployments_title}</h3>
                        <p class="text-xs text-muted-foreground">${i18nExt.deployments_subtitle}</p>
                    </div>
                `);
                customApps.forEach(app => gridEl.insertAdjacentHTML('beforeend', buildCard(app)));
            }
        }
        
        function openCustomAppModal() {
            const modal = document.getElementById('custom-app-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeCustomAppModal() {
            const modal = document.getElementById('custom-app-modal');
            modal.classList.add('hidden');
            document.getElementById('custom-app-form').reset();
        }

        function toggleSetupPortField() {
            const needsSetup = document.getElementById('custom-app-needs-setup').checked;
            const container = document.getElementById('setup-port-container');
            
            if (needsSetup) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('custom-app-setup-port').value = '';
            }
        }

        async function submitCustomApp(event) {
            event.preventDefault();
            const i18nExt = window.I18N.extensions;
        
            const btn = document.getElementById('btn-submit-custom');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-primary-foreground inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ${i18nExt.deploying}`;

            const needsDynamicPort = document.getElementById('custom-app-dynamic-port').checked;
            const needsSetupPort = document.getElementById('custom-app-needs-setup').checked;
            const setupPortValue = needsSetupPort ? (parseInt(document.getElementById('custom-app-setup-port').value) || 0) : 0;

            const payload = {
                name: document.getElementById('custom-app-name').value,
                description: document.getElementById('custom-app-desc').value,
                icon: document.getElementById('custom-app-icon').value || '📦',
                compose_yaml: document.getElementById('custom-app-yaml').value,
                needs_dynamic_port: needsDynamicPort,
                has_custom_setup: needsSetupPort,
                setup_port: setupPortValue,
                is_custom: true,
                category: 'optional'
            };

            try {
                const response = await fetch('/api/gateway/extensions/custom', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const responseClone = response.clone();

                if (!response.ok) {
                    let errorMessage = `Server Error: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.errors && Array.isArray(errorData.errors)) {
                            const details = errorData.errors.map(err => `• ${err.field}: ${err.message}`).join('\n');
                            errorMessage = `Deployment Failed:\n${details}`;
                        } else {
                            errorMessage = errorData.message || JSON.stringify(errorData);
                        }
                    } catch (e) {
                        const rawText = await responseClone.text();
                        errorMessage = `Server Error: ${response.status} - ${rawText}`;
                    }
                    throw new Error(errorMessage);
                }

                closeCustomAppModal();
                if (typeof fetchExtensionsStatus === 'function') {
                    fetchExtensionsStatus(); 
                }

            } catch (error) {
                console.error("Deployment failed:", error);
                alert(`${i18nExt.fail_deploy}${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                syncAppStates();
            }
        }

        function removeCustomApp(appId) {
            const i18nExt = window.I18N.extensions;
            const confirmMsg = i18nExt.confirm_remove.replace('%s', appId);
            if (!confirm(confirmMsg)) return;

            let btnRemove = document.getElementById(`btn-remove-${appId}`);
            if (!btnRemove) {
                console.error(`[Orchestrator UI] Target btn-remove-${appId} missing from DOM.`);
                return;
            }
            btnRemove.disabled = true;

            fetch(`/api/gateway/extensions/custom/remove?name=${encodeURIComponent(appId)}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    const badgeEl = document.getElementById(`badge-app-${appId}`);
                    if (badgeEl) {
                        const card = badgeEl.closest('div.bg-surface');
                        if (card) card.remove();
                    }
                    alert(i18nExt.remove_success.replace('%s', appId));
                } else {
                    return response.json().then(data => {
                        throw new Error(data.message || 'Unknown error occurred.');
                    });
                }
            })
            .catch(error => {
                console.error(`Failed to remove ${appId}:`, error);
                alert(i18nExt.fail_remove.replace('%s', appId) + error.message);
            })
            .finally(() => {
                btnRemove.disabled = false;
                syncAppStates();
            });
        }
    </script>
</div>
{{ end }}
